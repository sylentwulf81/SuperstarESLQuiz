<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Team Peach Emblem matching user uploaded team_peach.png -->
  <!-- Pink Background -->
  <rect width="200" height="200" fill="#EA629F" />
  
  <!-- Central White Circle -->
  <circle cx="100" cy="100" r="78" fill="#FFFFFF" />

  <!-- Peach Crown Group -->
  <g id="crown">
    <!-- Crown Outer Body (3 Points) with Thick Orange/Amber Border -->
    <!-- Left point, Center high point, Right point, and lower base band -->
    <polygon points="56,152 144,152 144,136 158,64 121,105 100,37 79,105 42,64 56,136"
             fill="#FFE600"
             stroke="#E67300"
             stroke-width="7"
             stroke-linejoin="round" />

    <!-- Crown Base Dividing Line -->
    <line x1="56" y1="124" x2="144" y2="124" stroke="#E67300" stroke-width="5" stroke-linecap="round" />

    <!-- Left Jewel: Cyan oval with dark blue border -->
    <ellipse cx="53" cy="120" rx="12" ry="16" fill="#00A2E8" stroke="#005B96" stroke-width="4.5" />

    <!-- Right Jewel: Cyan oval with dark blue border -->
    <ellipse cx="147" cy="120" rx="12" ry="16" fill="#00A2E8" stroke="#005B96" stroke-width="4.5" />

    <!-- Center Jewel: Ruby red oval with dark maroon border -->
    <ellipse cx="100" cy="120" rx="15" ry="18" fill="#D30B1C" stroke="#7A1322" stroke-width="5" />
  </g>
</svg>
