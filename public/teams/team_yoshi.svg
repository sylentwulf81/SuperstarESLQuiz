<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Egg clip path to accurately crop interior spots -->
    <clipPath id="eggClip">
      <ellipse cx="100" cy="100" rx="58" ry="67" transform="rotate(28 100 100)" />
    </clipPath>
  </defs>

  <!-- Green Background -->
  <rect width="200" height="200" fill="#6AB82D" />

  <!-- Central White Circle -->
  <circle cx="100" cy="100" r="78" fill="#FFFFFF" />

  <!-- Yoshi Egg with Green Spots -->
  <g>
    <!-- White Egg Body with clipped spots -->
    <g clip-path="url(#eggClip)">
      <!-- Egg White Fill -->
      <rect x="0" y="0" width="200" height="200" fill="#FFFFFF" />

      <!-- Top Right Green Spot -->
      <circle cx="112" cy="62" r="32" fill="#6AB82D" />

      <!-- Bottom Right Green Spot -->
      <circle cx="114" cy="128" r="29" fill="#6AB82D" />

      <!-- Left Edge Green Spot (clipped by egg boundary) -->
      <circle cx="48" cy="100" r="31" fill="#6AB82D" />
    </g>

    <!-- Thick Dark Outline for Egg Shell -->
    <ellipse cx="100" cy="100" rx="58" ry="67" transform="rotate(28 100 100)"
             fill="none" stroke="#171212" stroke-width="7" stroke-linejoin="round" />
  </g>
</svg>
